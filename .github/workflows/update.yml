name: Update board

on:
  schedule:
    - cron: "0 9 * * *"          # daily 09:00 UTC; should_run.py decides if it actually rebuilds
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if should_run.py says skip"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: board-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CFBD_KEY: ${{ secrets.CFBD_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "pandas==2.2.*" "numpy==1.26.*" "scipy==1.13.*"

      - name: Cache CFBD raw JSON
        uses: actions/cache@v4
        with:
          path: data/cfbd_raw
          key: cfbd-raw-${{ github.run_id }}
          restore-keys: cfbd-raw-

      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "forced by workflow_dispatch"; exit 0
          fi
          if python should_run.py; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Refresh data + rescore both boards
        if: steps.gate.outputs.run == 'true'
        run: bash run_pipeline.sh

      - name: Commit refreshed board
        if: steps.gate.outputs.run == 'true'
        run: |
          date -u +%Y-%m-%d > data/.last_pipeline_run
          git config user.name  "board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/scores.json dashboard/rupi_scores.json \
                  data/wrpi_database.csv rupi/out/rupi_database.csv \
                  data/pool_2023_2025.csv data/.last_pipeline_run
          git commit -m "chore: refresh board ($(date -u +%Y-%m-%d))" || { echo "no changes"; exit 0; }
          git push
      # deploy.yml publishes Pages on the resulting push to dashboard/**
