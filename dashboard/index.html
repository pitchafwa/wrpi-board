<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WRPI Board</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0f1318" />
<meta name="apple-mobile-web-app-title" content="WRPI Board" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root{--paper:#f3f5f7;--surface:#fff;--surface-2:#eef1f4;--ink:#171d24;--ink-soft:#55606c;
    --ink-faint:#8a939d;--line:#dde2e8;--line-strong:#c6cdd5;--accent:#a9741f;
    --good:#2f7d5d;--warn:#b1472f;--t-hi:#2f7d5d;--t-mid:#a9741f;--t-lo:#8a939d;--diamond:#3a86c8;--star:#d9a520}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#0f1318;--surface:#171d24;--surface-2:#1e252d;--ink:#e2e6ea;--ink-soft:#97a2ad;
    --ink-faint:#6c7680;--line:#2a323b;--line-strong:#39434e;--accent:#d69a3f;
    --good:#4ea883;--warn:#d3694c;--t-hi:#4ea883;--t-mid:#d69a3f;--t-lo:#6c7680;--diamond:#5aa0dd;--star:#e8bf4a}}
  :root[data-theme="dark"]{--paper:#0f1318;--surface:#171d24;--surface-2:#1e252d;--ink:#e2e6ea;--ink-soft:#97a2ad;
    --ink-faint:#6c7680;--line:#2a323b;--line-strong:#39434e;--accent:#d69a3f;
    --good:#4ea883;--warn:#d3694c;--t-hi:#4ea883;--t-mid:#d69a3f;--t-lo:#6c7680;--diamond:#5aa0dd;--star:#e8bf4a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1260px;margin:0 auto;padding:2rem clamp(.7rem,3vw,2rem) 4rem}
  h1{font-family:"Zilla Slab",Georgia,serif;font-weight:700;font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 .15rem}
  .sub{color:var(--ink-soft);font-size:.92rem;margin-bottom:1.3rem;max-width:66ch}
  a{color:var(--accent)}
  .statbar{display:flex;flex-wrap:wrap;gap:1.1rem 1.9rem;padding:1rem 1.2rem;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;margin-bottom:1.1rem;font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-soft)}
  .banner{padding:.7rem 1rem;border-radius:9px;margin-bottom:1.1rem;font-size:.82rem;line-height:1.5;
    background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--ink-soft)}
  .banner b{color:var(--accent)}
  .statbar b{display:block;font:600 1.1rem/1 "IBM Plex Sans",sans-serif;color:var(--ink);letter-spacing:-.01em}

  .h2h{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem;margin-bottom:1.6rem}
  .h2h .eye{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.7rem}
  .h2h .row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  .h2h input{flex:1;min-width:190px;padding:.5rem .6rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:.86rem}
  .h2h .vs{font-family:"IBM Plex Mono",monospace;color:var(--ink-faint);font-size:.8rem}
  .h2h .result{margin-top:1rem;display:none}
  .probbar{height:30px;border-radius:8px;overflow:hidden;display:flex;font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:500}
  .probbar .a,.probbar .b{color:var(--ink);display:flex;align-items:center;padding:0 .6rem;white-space:nowrap;overflow:hidden;transition:width .25s}
  .probbar .b{justify-content:flex-end}
  .probbar .win{background:color-mix(in srgb,var(--good) 34%,transparent)}
  .probbar .lose{background:color-mix(in srgb,var(--warn) 30%,transparent)}
  .edges{display:grid;grid-template-columns:1fr 1fr;gap:.25rem 1.4rem;margin-top:.8rem;font-size:.8rem}
  .edges .e{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;gap:.6rem}
  .edges .e b{white-space:nowrap}

  .controls{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.4rem;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:var(--surface);color:var(--ink-soft);padding:.42rem .72rem;font:inherit;font-size:.8rem;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
  .hint{font-size:.72rem;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace}
  input[type=search]{flex:1;min-width:150px;padding:.42rem .7rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.84rem}
  .legend{font-size:.78rem;color:var(--ink-faint);margin:.2rem 0 1rem;line-height:1.65}
  .legend b{color:var(--ink-soft)} .legend .dia{color:var(--diamond)} .legend .st{color:var(--star)}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:.84rem}
  th,td{padding:.55rem .6rem;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  thead th{position:sticky;top:0;background:var(--surface-2);border-top:0;font-family:"IBM Plex Mono",monospace;
    font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;cursor:pointer;user-select:none}
  thead th.sorted::after{content:" ▾";color:var(--accent)}
  thead th.sorted.asc::after{content:" ▴"}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
  td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .tier{display:inline-block;min-width:1.5rem;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:500;padding:.08rem .3rem;border-radius:4px;font-size:.76rem}
  .wr{display:inline-flex;align-items:center;gap:.4rem;justify-content:flex-end}
  .wr .n{font-family:"IBM Plex Mono",monospace;font-weight:500}
  .wr .b{position:relative;height:5px;width:44px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .wr .b>span{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
  .wr .p{font-size:.66rem;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;width:1.6rem;text-align:left}
  .ic{margin-left:.25rem;font-size:.82rem}
  .detail td{background:var(--surface-2);border-top:0;white-space:normal}
  .comps{display:flex;flex-wrap:wrap;gap:.4rem;padding:.3rem 0}
  .comp{font-family:"IBM Plex Mono",monospace;font-size:.73rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
  .comp b{color:var(--accent)}
  .note{font-size:.77rem;color:var(--ink-faint);margin-top:.25rem}
  .simwrap{margin-top:.6rem}
  .simwrap .lbl{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.35rem}
  .sim{display:flex;flex-wrap:wrap;gap:.4rem}
  .sim .s{font-family:"IBM Plex Mono",monospace;font-size:.75rem;padding:.25rem .55rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:flex;gap:.4rem;align-items:center}
  .sim .s .m{color:var(--accent)}
  .sim .s .o{font-size:.66rem;padding:.02rem .3rem;border-radius:4px}
  footer{margin-top:2.6rem;padding-top:1.1rem;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-faint);line-height:1.7}
  .err{padding:2rem;text-align:center;color:var(--warn);font-family:"IBM Plex Mono",monospace}

  /* ---------- mobile: table -> stacked cards ---------- */
  @media(max-width:720px){
    .wrap{padding:1.2rem .7rem 3rem}
    h1{font-size:1.6rem}
    .sub{font-size:.86rem}
    .statbar{gap:.8rem 1.3rem;font-size:.7rem;padding:.8rem .9rem}
    .h2h .row{flex-direction:column;align-items:stretch}
    .h2h .vs{align-self:center}
    .controls{gap:.4rem} .controls .hint{order:9;flex-basis:100%}
    .seg{flex-wrap:wrap}
    #segCls{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
    #segCls button{border-left:1px solid var(--line);border-top:1px solid var(--line)}
    input[type=search]{min-width:0;flex-basis:100%;order:1}
    #boardPane .tablewrap{border:0;background:transparent;overflow:visible}
    #boardPane table,#boardPane tbody,#boardPane tr,#boardPane td{display:block;width:100%}
    #boardPane thead{display:none}
    #boardPane tbody tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:.6rem;padding:.5rem .7rem}
    #boardPane tbody tr:hover{background:var(--surface)}
    #boardPane tbody tr.detail{border-top:0;border-radius:0 0 10px 10px;margin-top:-.6rem}
    #boardPane td{border:0;text-align:left !important;padding:.18rem 0;display:flex;justify-content:space-between;gap:1rem;font-size:.9rem}
    #boardPane td:first-child{display:block;font-family:"Zilla Slab",serif;font-size:1.05rem;font-weight:500;padding-bottom:.35rem;border-bottom:1px solid var(--line);margin-bottom:.3rem}
    #boardPane td:first-child::before{content:none}
    .ic{margin-left:.35rem}
    /* keep only Player (1), Class (2), WRPI (4) on the card; rest live in the expanded view */
    #boardPane tbody tr:not(.detail) td:nth-child(3),
    #boardPane tbody tr:not(.detail) td:nth-child(n+5){display:none}
    #boardPane td::before{content:attr(data-label);font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);align-self:center}
    #boardPane td.num{font-size:.9rem}
    .wr{gap:.5rem}
    #boardPane .detail td{display:block}#boardPane .detail td::before{content:none}
    /* About: keep tables as real (small, scrollable) tables */
    #aboutPane table{display:block;overflow-x:auto;font-size:.8rem;white-space:nowrap}
    #aboutPane h2{font-size:1.05rem;margin:1.4rem 0 .4rem}
    #aboutPane div{font-size:.88rem !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="hTitle">WRPI Board</h1>
  <div class="sub" id="hSub"></div>

  <div class="controls" style="margin-bottom:1rem">
    <div class="seg" id="segPos">
      <button data-v="wr" aria-pressed="true">Wide receivers</button>
      <button data-v="rb">Running backs</button>
    </div>
    <div class="seg" id="segView">
      <button data-v="board" aria-pressed="true">Board</button>
      <button data-v="about">How it works</button>
    </div>
  </div>

  <div id="aboutPane" style="display:none"></div>
  <div id="boardPane">
  <div class="banner" id="provBanner" style="display:none"></div>
  <div class="statbar" id="statbar"></div>

  <div class="h2h" id="h2hBox">
    <div class="eye" id="h2hEye">Head-to-head — which rookie WR?</div>
    <div class="row">
      <input id="pA" list="plist" placeholder="type player A…" autocomplete="off" />
      <span class="vs">vs</span>
      <input id="pB" list="plist" placeholder="type player B…" autocomplete="off" />
    </div>
    <datalist id="plist"></datalist>
    <div class="result" id="h2hResult">
      <div class="probbar"><div class="a" id="barA"></div><div class="b" id="barB"></div></div>
      <div class="note" id="h2hNote"></div>
      <div class="edges" id="h2hEdges"></div>
    </div>
  </div>

  <div class="controls">
    <div class="seg" id="segCls">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="2026">2026</button><button data-v="2025">2025</button>
      <button data-v="2024">2024</button><button data-v="2023">2023</button>
      <button data-v="2022">2022</button><button data-v="2021">2021</button><button data-v="2020">2020</button>
      <button data-v="2019">2019</button><button data-v="2018">2018</button><button data-v="2017">2017</button>
      <button data-v="2016">2016</button><button data-v="2015">2015</button>
    </div>
    <span class="hint">click a year · ctrl/⌘-click to add more</span>
    <input type="search" id="q" placeholder="filter by name…" />
    <div class="seg" id="segScore">
      <button data-v="post" aria-pressed="true">Post-draft</button>
      <button data-v="pre">Pre-draft</button>
    </div>
    <div class="seg" id="segFlag">
      <button data-v="none" aria-pressed="true">All</button>
      <button data-v="star" style="color:var(--star)">★ stars</button>
      <button data-v="diamond" style="color:var(--diamond)">◆ diamonds</button>
    </div>
  </div>
  <div class="legend" id="legend"></div>

  <div class="tablewrap"><table id="tbl"><thead><tr id="hrow"></tr></thead><tbody id="body"></tbody></table></div>
  </div>
  <footer id="foot"></footer>
</div>

<script>
let D=null, pos='wr', DATA={}, cls=new Set(['all']), score='post', flag='none', q='', sort={k:'_raw',asc:false}, open=new Set();
const sig=x=>1/(1+Math.exp(-x));
const tierColor=t=>t>=8?'var(--t-hi)':t>=5?'var(--t-mid)':'var(--t-lo)';
const key=x=>x.Player+'|'+x.Year;
const pctF=v=>v==null?'—':(v*100).toFixed(0)+'%';
const lastName=n=>{const t=n.replace(/\s+(Jr\.?|Sr\.?|II|III|IV|V)$/i,'').trim().split(' ');return t[t.length-1];};
const CFG={
 wr:{
  file:'scores.json', name:'WRPI', label:'wide receivers', posN:'WR', hasH2H:true, mkey:'wrpi', starPct:'95th',
  title:'WRPI Board',
  sub:`Wide Receiver Prospect Indicator, fitted to actual fantasy production (best 3 of a player's first 5 seasons, PPR points per game). <b>Post-draft</b> is the topline and tracks draft capital by design. <b>Pre-draft</b> is the pre-NFL-draft talent read. <span class="legend"><b class="dia">◆</b> diamond in the rough, <b class="st">★</b> star-potential profile, <b style="color:var(--warn)">⚠</b> low-confidence inputs.</span>`,
  tips:{
   Player:'WR prospect. ◆ = diamond-in-the-rough flag (drafted after round 2, strong underlying profile). ★ = above the 95th-percentile star-potential line for the score shown.',
   Class:'Draft class.', Tier:'Decile of the post-draft WRPI percentile (10 = top).',
   WRPI:'Raw WRPI score (the number the percentile is built from). Bar + small % = percentile vs the 2015–2020 reference class.',
   H2H:'Head-to-head tiebreaker score. Higher = the model favors this player against a similarly-drafted WR. Also drives the tool above.',
   Dia:'Diamond index — for WRs drafted after round 2, a weighted blend of the indicators that separate the future assets. Top quartile has hit ~15× the bottom.',
   Actual:'2015–22 only: actual fantasy-production percentile (best 3 of first 5 seasons, PPR PPG). Blank for 2023+.',
   Pick:'Overall draft slot. UDFA = undrafted.', Dom:'Best college season share of team receiving (yards + TD).',
   Eff:'Final college-season efficiency — CFBD PPA (points added per play).',
   Age:'Age on Jan 1 of the draft year. Younger is better.', Expl:'Athletic explosion percentile (vertical + broad + speed score).'},
  cols:()=>[
   {k:'Player',t:'Player',s:'str'},{k:'Year',t:'Class',s:'num'},{k:'tier',t:'Tier',s:'num'},
   {k:'_raw',t:'WRPI',s:'num'},
   {k:'diamond_score',t:'Dia',s:'num',fmt:v=>v==null?'—':v.toFixed(2)},
   {k:'tb_score',t:'H2H',s:'num',fmt:v=>v==null?'—':v.toFixed(2)},
   {k:'actual_fantasy_pctl',t:'Actual',s:'num',fmt:v=>v==null?'<span style="color:var(--ink-faint)">—</span>':(v*100).toFixed(0)},
   {k:'pick',t:'Pick',s:'num',fmt:v=>v>=260?'UDFA':v},
   {k:'best_dom',t:'Dom',s:'num',fmt:pctF},
   {k:'best_yds',t:'Yds',s:'num',fmt:v=>v==null?'—':Math.round(v)},
   {k:'final_ppa',t:'Eff',s:'num',fmt:v=>v==null?'—':v.toFixed(2)},
   {k:'nfl_entry_age',t:'Age',s:'num',fmt:v=>v==null?'—':v.toFixed(1)},
   {k:'explosion_p',t:'Expl',s:'num',fmt:v=>v==null?'—':(v*100).toFixed(0)}],
  profRows:d=>[
   ['Tier',d.tier],['Pick',d.pick>=260?'UDFA':d.pick],
   ['Dominator',pctF(d.best_dom)],['Best yds',d.best_yds==null?'—':Math.round(d.best_yds)],
   ['Efficiency',d.final_ppa==null?'—':d.final_ppa.toFixed(2)],
   ['Entry age',d.nfl_entry_age==null?'—':d.nfl_entry_age.toFixed(1)],
   ['Explosion',d.explosion_p==null?'—':(d.explosion_p*100).toFixed(0)],
   d.tb_score!=null?['H2H',d.tb_score.toFixed(2)]:null,
   ['Diamond',d.diamond_score==null?'—':d.diamond_score.toFixed(2)],
   d.actual_fantasy_pctl!=null?['Actual fantasy',(d.actual_fantasy_pctl*100).toFixed(0)+' %ile']:null],
  detailNote:d=>`post-draft raw ${d.raw_post.toFixed(1)} (${(d.wrpi_post*100).toFixed(0)} %ile) · pre-draft raw ${d.raw_pre.toFixed(1)} (${(d.wrpi_pre*100).toFixed(0)} %ile)`
   +(d.tb_score!=null?` · H2H ${d.tb_score.toFixed(2)}`:'')
   +(d.is_diamond?' · <b style="color:var(--diamond)">diamond in the rough</b>':'')
   +(d.actual_fantasy_pctl!=null?` · actual fantasy ${(d.actual_fantasy_pctl*100).toFixed(0)} %ile`:'')
   +(d.actual_pctl_post!=null?` · original PSI ${(d.actual_pctl_post*100).toFixed(0)}`:''),
  statbar:m=>`
   <div><b>${D.scored.length}</b>WR · 2015–2026</div>
   <div><b>${m.post_cv_spearman}</b>post-draft CV Spearman <span style="opacity:.7">(pick ${m.pick_alone_spearman})</span></div>
   <div><b>${m.pre_cv_spearman}</b>pre-draft CV Spearman</div>
   <div><b>${(m.tiebreaker_loco_acc*100).toFixed(0)}%</b>head-to-head accuracy <span style="opacity:.7">(≤${m.tiebreaker_gap} picks apart)</span></div>
   <div><b>${m.diamond.lift5}×</b>diamond-flag hit lift <span style="opacity:.7">(late-round base ${(m.diamond.base_rate*100).toFixed(0)}%)</span></div>`,
  legend:s=>`Hover any header for its meaning. <b>WRPI</b> shows the raw score with its percentile.
   <b class="st">★</b> = ${s==='pre'?'pre':'post'}-draft WRPI at or above the 95th percentile — the line where star signal
   becomes real (${s==='pre'?'33% of these posted a WR1 season, 67% at least solid':'~64% at least solid'}).
   <b class="dia">◆</b> = drafted after round 2 but with a diamond-in-the-rough profile (multiple dominant college seasons,
   big plays, early declare, full athletic workout). <b>H2H</b> is the head-to-head tiebreaker — use it and the tool above
   when choosing between two rookies drafted close together.`,
  about:(m,cal)=>`
   <h2>What WRPI is</h2>
   <p>A model of wide-receiver <b>fantasy</b> production, fitted to the target
   <b>best-3-of-first-5-seasons PPR points per game</b> (career-ish dynasty value). Every input is
   knowable before a prospect plays an NFL snap.</p>
   <h2>The three numbers</h2>
   <p><b>Post-draft WRPI</b> (the topline) — a draft-capital curve plus a small college-efficiency
   term. It tracks the NFL draft by design and matches it in accuracy
   (cross-validated rank correlation ${m.post_cv_spearman} vs draft pick alone ${m.pick_alone_spearman}).
   Its job is the honest baseline, not to beat consensus.</p>
   <p><b>Pre-draft WRPI</b> — production volume + college efficiency + athletic explosion + entry age,
   no draft capital. The pre-NFL-draft talent read (CV ${m.pre_cv_spearman}).</p>
   <p><b>H2H tiebreaker</b> — a separate model trained only on pairs of receivers drafted within
   ${m.tiebreaker_gap} picks of each other. It picks the better one
   ${(m.tiebreaker_loco_acc*100).toFixed(0)}% of the time (vs 50% = follow draft order). Use it for
   head-to-head rookie-draft decisions; that's where the model adds value over consensus.</p>
   <h2>The flags</h2>
   <p><b class="st">★</b> star-potential — at or above the 95th percentile of the score shown. Historically
   ~a third of 95th-percentile pre-draft prospects posted a genuine WR1 season, two-thirds were at least solid.</p>
   <p><b class="dia">◆</b> diamond in the rough — drafted after round 2 but with a profile that says
   "should have gone higher": multiple 30%+ college dominator seasons, big plays, an early declare,
   a full athletic workout. The top quartile of that index has hit ~${m.diamond.lift5}× the
   late-round base rate (${(m.diamond.base_rate*100).toFixed(0)}%).</p>
   <p><b style="color:var(--warn)">⚠</b> low-confidence — key inputs came in thin (few athletic tests,
   no reliable college dominator from partial data, or no verified birth date). Read the score with more salt.</p>
   <h2>Calibration — how the tiers have actually performed</h2>
   <p>Historical prospects (2015–2022), by WRPI decile. "Became startable" = posted at least one
   ~WR2 fantasy season (≥13 PPR PPG) in their first three years.</p>
   ${calTbl(cal.post,'Post-draft')}${calTbl(cal.pre,'Pre-draft')}
   <p style="color:var(--ink-faint)">Signal concentrates in tiers 8–10; below that the score is
   roughly flat — the model isn't pretending to separate the bottom two thirds of a class that mostly doesn't produce.</p>
   <h2>Data</h2>
   <p>nflverse (draft, combine, weekly fantasy through the 2025 season) · array-carpenter/nfl-draft-data
   (combine + pro-day, hand size) · CollegeFootballData (college receiving, efficiency/PPA, usage,
   SP+ ratings, recruiting, returns) · FantasyPros dynasty consensus (2021+). Reference class for
   percentiles: ${m.reference_n} players, ${m.reference_years[0]}–${m.reference_years[1]}.</p>
   <p><a href="https://github.com/pitchafwa/wrpi-board">Source & methodology on GitHub</a>.</p>`
 },
 rb:{
  file:'rbpi_scores.json', name:'RBPI', label:'running backs', posN:'RB', hasH2H:false, mkey:'rbpi', starPct:'90th',
  title:'RBPI Board',
  sub:`Running Back Prospect Indicator, fitted to actual fantasy production (best 2 of a player's first 3 seasons, PPR points per game — RBs peak early). <b>Post-draft</b> is the topline; it beats draft capital alone. <b>Pre-draft</b> is the pre-NFL-draft talent read (a coarse tier — RB production is opportunity-gated). <span class="legend"><b class="dia">◆</b> diamond in the rough, <b class="st">★</b> star-potential profile, <b style="color:var(--warn)">⚠</b> low-confidence inputs.</span>`,
  tips:{
   Player:'RB prospect. ◆ = diamond-in-the-rough flag (drafted outside round 1, or undrafted, with a strong profile). ★ = above the 90th-percentile star-potential line for the score shown.',
   Class:'Draft class.', Tier:'Decile of the post-draft RBPI percentile (10 = top).',
   RBPI:'Raw RBPI score (the number the percentile is built from). Bar + small % = percentile vs the 2015–2020 reference class.',
   Dia:'Diamond index — for RBs drafted outside round 1 (incl. undrafted), a weighted blend of the indicators that separate the future assets. Top quartile has hit ~2× the rest; LOCO precision@5 0.53 vs 0.25 base.',
   Actual:'2015–23 only: actual fantasy-production percentile (best 2 of first 3 seasons, PPR PPG). Blank for 2024+.',
   Pick:'Overall draft slot. UDFA = undrafted (kept if they later logged real NFL touches).',
   Dom:'Best college season scrimmage dominator — share of team rushing + receiving yards & TDs.',
   'Rec%':'Best college season receiving-yard share of the team — the 3-down / pass-catching archetype tell.',
   'Car%':'Best college season share of team carries — bell-cow vs committee.',
   YPC:'Career college yards per carry.',
   Age:'Age at the NFL draft. Younger is better (RB shelf life is short).', Expl:'Athletic explosion percentile (vertical + broad + speed score).'},
  cols:()=>[
   {k:'Player',t:'Player',s:'str'},{k:'Year',t:'Class',s:'num'},{k:'tier',t:'Tier',s:'num'},
   {k:'_raw',t:'RBPI',s:'num'},
   {k:'diamond_score',t:'Dia',s:'num',fmt:v=>v==null?'—':v.toFixed(2)},
   {k:'actual_fantasy_pctl',t:'Actual',s:'num',fmt:v=>v==null?'<span style="color:var(--ink-faint)">—</span>':(v*100).toFixed(0)},
   {k:'pick',t:'Pick',s:'num',fmt:v=>v>=260?'UDFA':v},
   {k:'best_dom',t:'Dom',s:'num',fmt:pctF},
   {k:'best_rec_ydshare',t:'Rec%',s:'num',fmt:pctF},
   {k:'best_rush_share',t:'Car%',s:'num',fmt:pctF},
   {k:'career_ypc',t:'YPC',s:'num',fmt:v=>v==null?'—':v.toFixed(1)},
   {k:'nfl_entry_age',t:'Age',s:'num',fmt:v=>v==null?'—':v.toFixed(1)},
   {k:'explosion_p',t:'Expl',s:'num',fmt:v=>v==null?'—':(v*100).toFixed(0)}],
  profRows:d=>[
   ['Tier',d.tier],['Pick',d.pick>=260?'UDFA':d.pick],
   ['Scrim dominator',pctF(d.best_dom)],['Rec-yd share',pctF(d.best_rec_ydshare)],
   ['Carry share',pctF(d.best_rush_share)],['Career YPC',d.career_ypc==null?'—':d.career_ypc.toFixed(1)],
   ['College PPA',d.avg_ppa==null?'—':d.avg_ppa.toFixed(2)],
   ['Entry age',d.nfl_entry_age==null?'—':d.nfl_entry_age.toFixed(1)],
   ['Explosion',d.explosion_p==null?'—':(d.explosion_p*100).toFixed(0)],
   ['Diamond',d.diamond_score==null?'—':d.diamond_score.toFixed(2)],
   d.actual_fantasy_pctl!=null?['Actual fantasy',(d.actual_fantasy_pctl*100).toFixed(0)+' %ile']:null],
  detailNote:d=>`post-draft raw ${d.raw_post.toFixed(1)} (${(d.rbpi_post*100).toFixed(0)} %ile) · pre-draft raw ${d.raw_pre.toFixed(1)} (${(d.rbpi_pre*100).toFixed(0)} %ile)`
   +(d.is_diamond?' · <b style="color:var(--diamond)">diamond in the rough</b>':'')
   +(d.is_udfa?` · <span style="color:var(--ink-faint)">${d.udfa_type==='projected'?'projected — went undrafted':'UDFA (logged NFL touches)'}</span>`:'')
   +(d.actual_fantasy_pctl!=null?` · actual fantasy ${(d.actual_fantasy_pctl*100).toFixed(0)} %ile`:''),
  statbar:m=>`
   <div><b>${D.scored.length}</b>RB · 2015–2026 <span style="opacity:.7">(${m.n_udfa} UDFA)</span></div>
   <div><b>${m.post_cv_spearman}</b>post-draft CV Spearman <span style="opacity:.7">(pick ${m.pick_alone_spearman})</span></div>
   <div><b>${m.pre_cv_spearman}</b>pre-draft CV Spearman</div>
   <div><b>${m.diamond.lift5}×</b>diamond-flag hit lift <span style="opacity:.7">(late base ${(m.diamond.base_rate*100).toFixed(0)}%, P@5 ${(m.diamond.prec5*100).toFixed(0)}%)</span></div>
   <div><b>${(m.star_pctl*100).toFixed(0)}th</b>star line <span style="opacity:.7">(pctl of the shown score)</span></div>`,
  legend:s=>`Hover any header for its meaning. <b>RBPI</b> shows the raw score with its percentile.
   <b class="st">★</b> = ${s==='pre'?'pre':'post'}-draft RBPI at or above the 90th percentile — where the league-winner
   signal turns on (${s==='pre'?'57% posted a startable season vs 38% just below':'73% posted a startable season vs 39% just below'}).
   <b class="dia">◆</b> = drafted outside round 1 (or undrafted) but with a diamond-in-the-rough profile
   (early declare, strong YPC + TD rate, bell-cow carry share, athletic explosion). Post-draft RBPI is the
   number to use for post-NFL-draft rookie drafts.`,
  about:(m,cal)=>`
   <h2>What RBPI is</h2>
   <p>A model of running-back <b>fantasy</b> production, fitted to the target
   <b>best-2-of-first-3-seasons PPR points per game</b>. It's front-loaded on purpose — RBs peak around
   age 24–25 and fall off a cliff near 27, so early production is what wins dynasty. Every input is
   knowable before a prospect plays an NFL snap.</p>
   <h2>The two numbers</h2>
   <p><b>Post-draft RBPI</b> (the topline) — a draft-capital curve plus receiving-role, efficiency and
   dominator terms. Cross-validated rank correlation <b>${m.post_cv_spearman}</b> vs draft pick alone
   ${m.pick_alone_spearman}: it actually <b>edges out draft capital</b>, because a back's college
   receiving-yard share predicts opportunity beyond where he was drafted. This is the number to use for
   post-NFL-draft rookie drafts.</p>
   <p><b>Pre-draft RBPI</b> — college scrimmage dominator + receiving role + athletic explosion + age,
   no draft capital. CV <b>${m.pre_cv_spearman}</b> — honestly modest, and that's the right answer for
   RB: production is opportunity-gated, so a pure talent read has a low ceiling. Treat it as a coarse
   tier, not a precise rank.</p>
   <p>No head-to-head tiebreaker for RB yet — it's on the backlog.</p>
   <h2>The flags</h2>
   <p><b class="st">★</b> star-potential — at or above the <b>90th</b> percentile of the score shown
   (RB has fewer elite fantasy seasons than WR, so the line sits lower than WRPI's 95th). Post-draft:
   73% of players above it posted a startable season, vs 39% just below.</p>
   <p><b class="dia">◆</b> diamond in the rough — drafted <b>outside round 1</b> (or undrafted) but with a
   profile that says the fantasy points are coming anyway: an early declare, strong college YPC and TD
   rate, a bell-cow carry share, athletic explosion. The cutoff is round 1 because Day-1 RBs already hit
   ~71% on draft capital alone — the useful question is who among everyone else still produces. Top
   quartile of the index has hit ~${m.diamond.lift5}× the rest (LOCO precision@5
   ${(m.diamond.prec5*100).toFixed(0)}% vs ${(m.diamond.base_rate*100).toFixed(0)}% base). Catches
   Kamara, Hunt, D. Johnson, A. Jones, James Robinson, Kyren Williams, Achane.</p>
   <p><b style="color:var(--warn)">⚠</b> low-confidence — key inputs came in thin (no athletic testing,
   no reliable college dominator from partial data, or no verified birth date). Small-school backs
   (e.g. D-II) can't be matched to college data at all and land here.</p>
   <h2>Calibration — how the tiers have actually performed</h2>
   <p>Historical prospects (2015–2023), by RBPI decile. "Became startable" = posted at least one
   ~RB2 fantasy season (≥14 PPR PPG) in their first three or four years.</p>
   ${calTbl(cal.post,'Post-draft')}${calTbl(cal.pre,'Pre-draft')}
   <p style="color:var(--ink-faint)">Discrimination concentrates in the top two deciles; below that the
   score is roughly flat.</p>
   <h2>The pool</h2>
   <p>Every drafted RB 2015–2026, plus a supplement of ${m.n_udfa} undrafted RBs who went on to log real
   NFL touches (Ekeler, James Robinson, Lindsay, Warren…) — RB is the position where undrafted hits
   actually happen, so leaving them out would blind the diamond flag.</p>
   <h2>Data</h2>
   <p>nflverse (draft, combine, weekly fantasy through the 2025 season) · CollegeFootballData (college
   rushing + receiving, efficiency/PPA, usage, SP+ ratings, recruiting) · array-carpenter/nfl-draft-data
   (combine + pro-day). Reference class for percentiles: ${m.reference_n} players,
   ${m.reference_years[0]}–${m.reference_years[1]}.</p>
   <p><a href="https://github.com/pitchafwa/wrpi-board">Source & methodology on GitHub</a>.</p>`
 }
};
function C(){return CFG[pos];}
function calTbl(rows,label){return `<table style="width:auto;margin:.4rem 0 1rem"><thead><tr>
  <th style="text-align:left">${label} tier</th><th>became startable</th><th>avg outcome %ile</th><th>n</th></tr></thead><tbody>${
  rows.slice().reverse().map(r=>`<tr><td style="text-align:left">${r._t}</td><td class="num">${(r.hit_rate*100).toFixed(0)}%</td><td class="num">${(r.avg_outcome_pctl*100).toFixed(0)}</td><td class="num">${r.n}</td></tr>`).join('')}</tbody></table>`;}
function inCls(d){ if(cls.has('all'))return true; return cls.has(String(d.Year)); }
function view(){
 const mk=C().mkey;
 let r=D.scored.filter(inCls).map(d=>({...d,
   _s: d[mk+'_'+score],
   _raw: d['raw_'+score],
   _star: d['is_star_'+score]}));
 if(q) r=r.filter(d=>d.Player.toLowerCase().includes(q));
 if(flag==='star') r=r.filter(d=>d._star);
 if(flag==='diamond') r=r.filter(d=>d.is_diamond);
 const cc=C().cols().find(c=>c.k===sort.k)||{s:'num'};
 r.sort((a,b)=>{let x=a[sort.k],y=b[sort.k]; if(x==null)return 1; if(y==null)return -1;
  return cc.s==='str'?(sort.asc?String(x).localeCompare(y):String(y).localeCompare(x)):(sort.asc?x-y:y-x);});
 return r;
}
function render(){
 const CO=C().cols(), TIPS=C().tips;
 hrow.innerHTML=CO.map(c=>`<th data-k="${c.k}" title="${(TIPS[c.t]||'').replace(/"/g,'&quot;')}" class="${sort.k===c.k?'sorted '+(sort.asc?'asc':''):''}">${c.t}</th>`).join('');
 hrow.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sort=sort.k===k?{k,asc:!sort.asc}:{k,asc:k==='Player'};render();});
 body.innerHTML='';
 view().forEach(d=>{
  const tr=document.createElement('tr');
  tr.innerHTML=CO.map(c=>{
   const L=` data-label="${c.t}"`;
   if(c.k==='Player'){
     const icons=(d.is_diamond?`<span class="ic" style="color:var(--diamond)" title="diamond in the rough">◆</span>`:'')
                +(d._star?`<span class="ic" style="color:var(--star)" title="star-potential profile (${C().starPct} pctl)">★</span>`:'')
                +(d.low_conf?`<span class="ic" style="color:var(--warn)" title="low-confidence profile — ${(d.low_conf_reason||'').replace(/"/g,'&quot;')}">⚠</span>`:'');
     return `<td${L}>${d.Player}${icons}</td>`;}
   if(c.k==='tier') return `<td class="num"${L}><span class="tier" style="background:color-mix(in srgb,${tierColor(d.tier)} 18%,transparent);color:${tierColor(d.tier)}">${d.tier}</span></td>`;
   if(c.k==='_raw') return `<td class="num"${L}><span class="wr"><span class="n">${d._raw.toFixed(1)}</span><span class="b"><span style="width:${(d._s*100).toFixed(0)}%"></span></span><span class="p">${(d._s*100).toFixed(0)}</span></span></td>`;
   const v=d[c.k]; return `<td class="num"${L}>${c.fmt?c.fmt(v,d):v}</td>`;
  }).join('');
  tr.onclick=()=>{const id=key(d);open.has(id)?open.delete(id):open.add(id);render();};
  body.appendChild(tr);
  if(open.has(key(d))){
   const dr=document.createElement('tr');dr.className='detail';
   const comps=Object.entries(score==='pre'?d.comp_pre:d.comp_post).map(([k,v])=>`<span class="comp">${k} <b>${v}</b></span>`).join('');
   const simHtml=(d.similar||[]).slice(0,5).map(s=>{
     let o='';
     if(s.fant!=null){const t=s.fant>=.85?'var(--good)':s.fant<=.4?'var(--warn)':'var(--ink-faint)';
       o=`<span class="o" style="background:color-mix(in srgb,${t} 18%,transparent);color:${t}">fant ${(s.fant*100).toFixed(0)}</span>`;}
     return `<span class="s">${s.p} <span style="color:var(--ink-faint)">'${String(s.y).slice(2)}</span> <span class="m">${s.sim.toFixed(0)}</span>${o}</span>`;
   }).join('');
   const prof=C().profRows(d).filter(Boolean).map(([k,v])=>`<span class="comp">${k} <b>${v}</b></span>`).join('');
   dr.innerHTML=`<td colspan="${CO.length}"><div class="comps">${prof}</div>
     <div class="comps">${comps}<span class="comp">= raw <b>${(score==='pre'?d.raw_pre:d.raw_post).toFixed(1)}</b></span></div>
     <div class="note">${C().detailNote(d)}</div>
     <div class="simwrap"><div class="lbl">closest profiles (similarity 0–100 · fant = their actual fantasy %ile)</div><div class="sim">${simHtml||'<span style="color:var(--ink-faint)">—</span>'}</div></div></td>`;
   body.appendChild(dr);
  }
 });
}
function findPlayer(txt){
 txt=(txt||'').trim().toLowerCase(); if(!txt) return null;
 let m=D.scored.filter(x=>x.Player.toLowerCase()===txt || (x.Player+' ('+x.Year+')').toLowerCase()===txt);
 if(!m.length) m=D.scored.filter(x=>x.Player.toLowerCase().startsWith(txt));
 if(!m.length) m=D.scored.filter(x=>x.Player.toLowerCase().includes(txt));
 m.sort((a,b)=>b.Year-a.Year);
 return m[0]||null;
}
function h2h(){
 const a=findPlayer(pA.value), b=findPlayer(pB.value), R=document.getElementById('h2hResult');
 if(!a||!b||key(a)===key(b)||a.tb_score==null){R.style.display='none';return;}
 R.style.display='block';
 const pa=sig(a.tb_score-b.tb_score), pct=Math.round(pa*100);
 barA.style.width=pct+'%'; barB.style.width=(100-pct)+'%';
 barA.className = pa>=0.5 ? 'a win' : 'a lose';
 barB.className = pa>=0.5 ? 'b lose' : 'b win';
 barA.textContent=`${lastName(a.Player)} ${pct}%`;
 barB.textContent=`${100-pct}% ${lastName(b.Player)}`;
 const g=Math.abs(a.pick-b.pick);
 document.getElementById('h2hNote').textContent =
  `Model favours ${pa>=.5?a.Player:b.Player} (${(Math.max(pa,1-pa)*100).toFixed(0)}%). `+
  (g<=20?`Drafted ${g} picks apart — the range where this has been right ~65% of the time.`
        :`Drafted ${g} picks apart — far enough that draft slot alone already carries a lot; treat the lean lightly.`);
 const W=D.tiebreaker.w;
 const LAB={best_dom:'college dominator',final_dom:'final-yr dominator',dom_age20:'dominance by age 20',
  n_seasons_30:'30%+ dominator seasons',best_yds:'best-season yards',career_yds:'career yards',
  final_ppa:'final-yr efficiency',best_ppa:'peak efficiency',best_usage:'college usage share',
  nfl_entry_age:'entry age (younger)',breakout_age:'breakout age (younger)',early_declare:'early declare',
  ras:'athleticism (RAS)',explosion_p:'explosion',speed_score:'speed score',weight:'weight',
  catch_radius:'catch radius',team_sp_off:'college offense (SP+)',team_sp_overall:'program strength (SP+)',
  recruit_rating:'recruiting rating',prod_over_recruit:'produced above recruiting',
  was_returner:'kick/punt returner',ret_td:'return TDs',col_qb_ypa:'college QB quality',
  final_spike:'final-season spike',dom_growth:'dominator growth'};
 const contrib=(D.tiebreaker.feats||[]).map(f=>{
  const za=(a.tbz&&a.tbz[f]!=null)?a.tbz[f]:0, zb=(b.tbz&&b.tbz[f]!=null)?b.tbz[f]:0;
  return {f,d:(W[f]||0)*(za-zb)};
 }).filter(x=>Math.abs(x.d)>0.04).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,8);
 document.getElementById('h2hEdges').innerHTML = contrib.map(x=>{
  const who=x.d>0?a.Player:b.Player;
  return `<div class="e"><span>${LAB[x.f]||x.f}</span><b style="color:${x.d>0?'var(--good)':'var(--warn)'}">${lastName(who)}</b></div>`;
 }).join('') || '<div class="e" style="color:var(--ink-faint)">profiles look even on the tiebreaker inputs</div>';
}
function renderAbout(){
 aboutPane.innerHTML=`<div style="max-width:70ch;font-size:.92rem;line-height:1.65;color:var(--ink-soft)">${C().about(D.model,D.calibration)}</div>`;
}
function boot(){
 const m=D.model;
 hTitle.textContent=C().title;
 hSub.innerHTML=C().sub;
 const ds=D.draft_status;
 if(ds && ds.provisional){
  const dt=ds.draft_date?new Date(ds.draft_date+'T12:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric'}):null;
  provBanner.style.display='block';
  provBanner.innerHTML=`<b>${ds.class} class — projected draft picks.</b> The NFL draft hasn't happened yet`
   +(dt?` (${dt})`:'')+`, so the <b>post-draft</b> ${C().name} for ${ds.class} prospects is running on mock draft position and will change once real picks land. The <b>pre-draft</b> score is complete.`;
 } else { provBanner.style.display='none'; }
 statbar.innerHTML=C().statbar(m);
 h2hBox.style.display=C().hasH2H?'block':'none';
 h2hEye.textContent=`Head-to-head — which rookie ${C().posN}?`;
 plist.innerHTML=D.scored.slice().sort((a,b)=>a.Player.localeCompare(b.Player)||b.Year-a.Year)
   .map(x=>`<option value="${x.Player} (${x.Year})">`).join('');
 pA.oninput=pB.oninput=h2h;
 segCls.querySelectorAll('button').forEach(btn=>btn.onclick=e=>{
  const v=btn.dataset.v;
  if(v==='all'){ cls=new Set(['all']); }
  else if(e.ctrlKey||e.metaKey){ cls.delete('all'); cls.has(v)?cls.delete(v):cls.add(v); if(!cls.size)cls.add('all'); }
  else { cls=new Set([v]); }
  segCls.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', cls.has(b.dataset.v)?'true':'false'));
  render();
 });
 segScore.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
  segScore.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true'); score=btn.dataset.v; render(); setLegend();
 });
 segFlag.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
  segFlag.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true'); flag=btn.dataset.v; render();
 });
 document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render();};
 segView.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
  segView.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true');
  const about=btn.dataset.v==='about';
  aboutPane.style.display=about?'block':'none';
  boardPane.style.display=about?'none':'block';
  if(about) renderAbout();
 });
 setLegend(); render();
}
function setLegend(){ legend.innerHTML=C().legend(score); }
function loadPos(p){
 pos=p;
 segPos.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===p?'true':'false'));
 cls=new Set(['all']); score='post'; flag='none'; q=''; open=new Set(); sort={k:'_raw',asc:false};
 document.getElementById('q').value='';
 segScore.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v==='post'?'true':'false'));
 segFlag.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v==='none'?'true':'false'));
 segView.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v==='board'?'true':'false'));
 aboutPane.style.display='none'; boardPane.style.display='block';
 const go=d=>{DATA[p]=d;D=d;boot();};
 if(DATA[p]) return go(DATA[p]);
 fetch(CFG[p].file,{cache:'no-store'}).then(r=>r.json()).then(go)
  .catch(e=>document.body.innerHTML=`<div class="err">Could not load ${CFG[p].file} — serve over HTTP (python -m http.server), not file://<br><br>${e}</div>`);
}
segPos.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{ if(btn.dataset.v!==pos) loadPos(btn.dataset.v); });
loadPos('wr');
</script>
